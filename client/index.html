<!doctype html>
<html lang="en" data-theme="cybercore">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080A0D" />
    <meta name="description" content="CyberLab Journal: a personal cybersecurity and cloud security learning workspace." />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>CyberLab Journal</title>
    <script>
      try { var t = localStorage.getItem('cyberlab_theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
