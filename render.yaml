# Render Blueprint: creates a free web service + a free PostgreSQL database.
# Note: Render's free Postgres instances expire after a limited period - check
# Render's current free-tier terms and export your data regularly (Settings > Export).
services:
  - type: web
    name: cyberlab-journal
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: cyberlab-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      # No APP_PASSWORD: the app opens without a login. Add APP_PASSWORD here later if you want one.
databases:
  - name: cyberlab-db
    plan: free
